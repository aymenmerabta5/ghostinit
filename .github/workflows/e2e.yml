name: E2E

on:
  push:
    branches: [master, develop]
    tags: ["v*"]
  pull_request:
    branches: [master, develop]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      billing:
        description: "Billing providers"
        default: "all"
        required: false
        type: string
      framework:
        description: "nextjs or tanstack-start"
        default: "tanstack-start"
        required: false
        type: choice
        options:
          - nextjs
          - tanstack-start
      features:
        description: "Feature list"
        default: "eve"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.ref_type == 'tag' && 'ghostinit-release-tags' || format('e2e-{0}-{1}', github.event.pull_request.number || github.ref, github.event_name) }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  e2e-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.0
      - name: Verify committed lock release age
        run: bun run check:lock-age
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Run fast generated/source checks
        env:
          E2E_TMP: ${{ runner.temp }}
        run: bash ./scripts/e2e-smoke.sh e2e-fast none nextjs none postgres
      - name: Run packaged architecture check
        shell: bash
        run: |
          report="$RUNNER_TEMP/ghostinit-architecture-check.json"
          bun ./dist/cli.js check --cwd "$RUNNER_TEMP/gi-test/e2e-fast" --json > "$report"
          REPORT_PATH="$report" bun -e '
            const reportPath = process.env.REPORT_PATH;
            if (!reportPath) throw new Error("architecture report path is missing");
            const payload = JSON.parse(await Bun.file(reportPath).text());
            if (
              payload.$schema !== "https://ghostinit.dev/schemas/json-envelope.schema.json" ||
              payload.schemaVersion !== 2 ||
              payload.success !== true ||
              payload.exitCode !== 0 ||
              payload.meta?.command !== "check" ||
              typeof payload.meta?.durationMs !== "number" ||
              payload.data?.summary?.blockers !== 0 ||
              payload.data?.summary?.highs !== 0
            ) {
              throw new Error("architecture check returned a failing JSON envelope");
            }
            if (
              !Array.isArray(payload.data?.findings) ||
              payload.data.findings.some(
                (finding) => finding?.severity === "HIGH" || finding?.severity === "BLOCKER"
              )
            ) {
              throw new Error("architecture check returned an invalid JSON envelope");
            }
          '
      - name: Verify fast E2E leaves no tracked changes
        run: |
          git diff --check
          git diff --exit-code
      - name: Clean generated runner temp
        if: always()
        shell: bash
        run: |
          if [ -z "${RUNNER_TEMP:-}" ] || [ "$RUNNER_TEMP" = "/" ]; then
            echo "Refusing unsafe RUNNER_TEMP cleanup." >&2
            exit 1
          fi
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 -type d \
            \( -name 'gi-test' -o -name 'gi-e2e-build-*' -o -name 'ghostinit-nitro-ws-*' \) \
            -exec rm -rf -- {} +
          rm -f -- "$RUNNER_TEMP/ghostinit-architecture-check.json"

  e2e-scheduled:
    if: github.event_name == 'schedule'
    needs: e2e-fast
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: tanstack-all
            framework: tanstack-start
            billing: all
            features: eve
          - id: next-all
            framework: nextjs
            billing: all
            features: eve,i18n
          - id: next-dual
            framework: nextjs
            billing: stripe,chargily
            features: eve
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.0
      - name: Verify committed lock release age
        run: bun run check:lock-age
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Run scheduled full generated project
        env:
          E2E_TMP: ${{ runner.temp }}
          E2E_INSTALL: "1"
          E2E_HEALTH: "1"
          E2E_CLEANUP: "1"
        run: >-
          bash ./scripts/e2e-smoke.sh
          "${{ matrix.id }}"
          "${{ matrix.billing }}"
          "${{ matrix.framework }}"
          "${{ matrix.features }}"
          postgres
      - name: Verify scheduled E2E leaves no tracked changes
        run: |
          git diff --check
          git diff --exit-code
      - name: Clean generated runner temp
        if: always()
        shell: bash
        run: |
          if [ -z "${RUNNER_TEMP:-}" ] || [ "$RUNNER_TEMP" = "/" ]; then
            echo "Refusing unsafe RUNNER_TEMP cleanup." >&2
            exit 1
          fi
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 -type d \
            \( -name 'gi-test' -o -name 'gi-e2e-build-*' -o -name 'ghostinit-nitro-ws-*' \) \
            -exec rm -rf -- {} +

  e2e-manual:
    if: github.event_name == 'workflow_dispatch'
    needs: e2e-fast
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.0
      - name: Verify committed lock release age
        run: bun run check:lock-age
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Run requested full generated project
        env:
          E2E_TMP: ${{ runner.temp }}
          E2E_INSTALL: "1"
          E2E_HEALTH: "1"
          E2E_CLEANUP: "1"
          REQUESTED_BILLING: ${{ inputs.billing }}
          REQUESTED_FRAMEWORK: ${{ inputs.framework }}
          REQUESTED_FEATURES: ${{ inputs.features }}
        run: |
          bash ./scripts/e2e-smoke.sh \
            manual-demo \
            "$REQUESTED_BILLING" \
            "$REQUESTED_FRAMEWORK" \
            "$REQUESTED_FEATURES" \
            postgres
      - name: Verify manual E2E leaves no tracked changes
        run: |
          git diff --check
          git diff --exit-code
      - name: Clean generated runner temp
        if: always()
        shell: bash
        run: |
          if [ -z "${RUNNER_TEMP:-}" ] || [ "$RUNNER_TEMP" = "/" ]; then
            echo "Refusing unsafe RUNNER_TEMP cleanup." >&2
            exit 1
          fi
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 -type d \
            \( -name 'gi-test' -o -name 'gi-e2e-build-*' -o -name 'ghostinit-nitro-ws-*' \) \
            -exec rm -rf -- {} +

  e2e-build-gated:
    needs: e2e-fast
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.0
      - name: Verify committed lock release age
        run: bun run check:lock-age
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Run production generated build tests
        run: bun run test:e2e-build
      - name: Verify production-build gate leaves no tracked changes
        run: |
          git diff --check
          git diff --exit-code
      - name: Clean generated runner temp
        if: always()
        shell: bash
        run: |
          if [ -z "${RUNNER_TEMP:-}" ] || [ "$RUNNER_TEMP" = "/" ]; then
            echo "Refusing unsafe RUNNER_TEMP cleanup." >&2
            exit 1
          fi
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 -type d \
            \( -name 'gi-test' -o -name 'gi-e2e-build-*' -o -name 'ghostinit-nitro-ws-*' \) \
            -exec rm -rf -- {} +

  runtime-security-gated:
    needs: e2e-fast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.0
      - name: Verify committed lock release age
        run: bun run check:lock-age
      - run: bun install --frozen-lockfile
      - name: Run built Nitro websocket runtime security probe
        env:
          NITRO_WEBSOCKET_RUNTIME: "1"
        run: bun test --timeout 900000 tests/integration/nitro-websocket-compat-runtime.test.ts
      - name: Verify runtime gate leaves no tracked changes
        run: |
          git diff --check
          git diff --exit-code
      - name: Clean generated runner temp
        if: always()
        shell: bash
        run: |
          if [ -z "${RUNNER_TEMP:-}" ] || [ "$RUNNER_TEMP" = "/" ]; then
            echo "Refusing unsafe RUNNER_TEMP cleanup." >&2
            exit 1
          fi
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 -type d \
            \( -name 'gi-test' -o -name 'gi-e2e-build-*' -o -name 'ghostinit-nitro-ws-*' \) \
            -exec rm -rf -- {} +
