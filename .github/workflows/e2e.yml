name: E2E

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      billing:
        description: "Billing providers"
        default: "all"
        required: false
      framework:
        description: "nextjs or tanstack-start"
        default: "tanstack-start"
        required: false
      features:
        description: "Feature list"
        default: "eve"
        required: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  e2e-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Run fast generated/source checks
        env:
          E2E_TMP: ${{ runner.temp }}
        run: ./scripts/e2e-smoke.sh e2e-fast none nextjs none postgres
      - name: Run packaged architecture check
        run: ./dist/cli.js check --cwd "$RUNNER_TEMP/gi-test/e2e-fast" --json

  e2e-scheduled:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: tanstack-all
            framework: tanstack-start
            billing: all
            features: eve
          - id: next-all
            framework: nextjs
            billing: all
            features: eve,i18n
          - id: next-dual
            framework: nextjs
            billing: stripe,chargily
            features: eve
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Run scheduled full generated project
        env:
          E2E_TMP: ${{ runner.temp }}
          E2E_INSTALL: "1"
          E2E_HEALTH: "1"
        run: >-
          ./scripts/e2e-smoke.sh
          "${{ matrix.id }}"
          "${{ matrix.billing }}"
          "${{ matrix.framework }}"
          "${{ matrix.features }}"
          postgres

  e2e-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Run requested full generated project
        env:
          E2E_TMP: ${{ runner.temp }}
          E2E_INSTALL: "1"
          E2E_HEALTH: "1"
        run: >-
          ./scripts/e2e-smoke.sh
          manual-demo
          "${{ inputs.billing }}"
          "${{ inputs.framework }}"
          "${{ inputs.features }}"
          postgres

  e2e-build-gated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Run opt-in generated build tests
        run: E2E_BUILD=1 bun test --timeout 300000 tests/integration/e2e-build.test.ts
