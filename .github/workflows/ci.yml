name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Check lint/format/types
        run: bun run check

      - name: Check turbo.json env sync
        run: bun run scripts/sync-turbo-env.ts --check

      - name: Check dependency versions
        run: bun run check:versions

      - name: Run tests
        run: bun run test

      - name: Install compatibility fixture dependencies
        run: |
          cd tests/fixtures/compatibility/drizzle-betterauth-orpc && bun install
          cd ../next-tailwind-biome && bun install

      - name: Run compatibility fixtures tests
        run: bun run test:fixtures

      - name: Build CLI
        run: bun run build

  generated-project-smoke:
    runs-on: ubuntu-latest
    needs: check-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Build CLI
        run: bun run build

      - name: Create and verify generated project
        run: |
          ./dist/cli.js create smoke --cwd /tmp --no-install --force
          cd /tmp/smoke
          bun install
          bun run format
          bun run format:check
          bun run lint
          bun run typecheck
          bun run test
          bun run build
